<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10 - Các bạn nữ 12A2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 500px;
            width: 90%;
            animation: fadeIn 1.5s ease-in-out;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #ffeb3b;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .heart {
            font-size: 3rem;
            color: #ff4757;
            animation: bounce 1s infinite alternate;
            margin-bottom: 15px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="heart">❤️</div>
        <h1>Chúc Mừng 20/10!</h1>
        <h2>Các bạn nữ 12A2</h2>
        <p>Nhân ngày Phụ nữ Việt Nam, xin gửi những lời chúc tốt đẹp nhất đến <strong>các bạn nữ 12A2</strong>. Chúc các bạn luôn luôn xinh đẹp, rạng rỡ, đạt kết quả cao trong học tập và luôn giữ được nụ cười rạng ngời trên môi!</p>
        <p><i>- Tập thể lớp thân yêu -</i></p>
    </div>
</body>
</html>
